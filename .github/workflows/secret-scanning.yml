name: Secret Scanning

# Runs on every push and PR so a credential cannot be committed unnoticed.
#
# Why this exists: `backend/.env` sat in git history with a LIVE Supabase
# service-role key, and `android/keystore/release-keystore.jks` with its
# passwords was committed to a PUBLIC repository. Neither was noticed for
# months. This job fails the build on the first commit that reintroduces
# either, instead of a person having to find it later.
#
# Deliberately dependency-free — no third-party scanner action. A security
# control should not depend on an external action's uptime, rate limits, or
# supply chain.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ── 1. Forbidden files that must never be tracked ──────────────────────────
  forbidden-files:
    name: No credential files tracked
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Fail if a credential file is tracked
        run: |
          echo "Scanning tracked files for credential material..."

          # Match on FILENAME, since that is what determines whether a file
          # belongs in git. Content is checked in the next job.
          #
          # `\.env` is anchored on the end so `.env.example` (a committed
          # template) is NOT matched — the first version of this check used
          # `\.env($|\.)`, which matched `.env.example` and would have failed
          # every build on a file that is meant to be there. A check that cries
          # wolf gets disabled, so the template is excluded explicitly.
          #
          # `!.env.example` style negation is not available in grep, so the
          # allowed names are filtered out below instead.
          PATTERNS='(^|/)(\.env|[^/]*\.jks|[^/]*\.keystore|key\.properties|client_secret[^/]*\.json|.*-firebase-adminsdk-[^/]*\.json|service-account[^/]*\.json|credentials\.json)$'

          # .env.example / key.properties.example are templates and belong in git.
          FOUND=$(git ls-files \
            | grep -Ev '(^|/)[^/]*\.example$' \
            | grep -Ei "$PATTERNS" || true)

          if [ -n "$FOUND" ]; then
            echo ""
            echo "::error::Credential-bearing file(s) are tracked in git:"
            echo "$FOUND" | sed 's/^/    /'
            echo ""
            echo "These must be removed from version control and their contents rotated:"
            echo "  git rm --cached <file>"
            echo "  add the path to .gitignore"
            echo ""
            echo "Removing the file does NOT undo the exposure — a secret that was"
            echo "ever committed must be treated as compromised and rotated."
            exit 1
          fi

          echo "OK - no credential files tracked."

  # ── 2. Known secret formats in any tracked file ────────────────────────────
  secret-patterns:
    name: No live credential values in the tree
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the scan covers every commit, not just the tip.
          fetch-depth: 0

      - name: Scan tracked files for credential patterns
        run: |
          # Patterns for credentials actually used by these projects, plus
          # common ones. Each is anchored so ordinary prose does not match.
          #
          # Deliberately NOT included: Firebase client API keys (AIza...) and
          # the Supabase anon key. Both SHIP INSIDE the mobile app and the
          # dashboard bundle, so they are public by design and cannot be kept
          # secret — flagging them would train people to ignore this check.
          # The protection for those is RLS, not secrecy (see migration 047).
          #
          # Nor are generic high-entropy strings: they produce enough false
          # positives that the check gets muted, which is worse than no check.
          PATTERNS='ghp_[A-Za-z0-9]{36}|gho_[A-Za-z0-9]{36}|ghs_[A-Za-z0-9]{36}|ghr_[A-Za-z0-9]{36}|sbp_[a-f0-9]{40}|vcp_[A-Za-z0-9]{40,}|rnd_[A-Za-z0-9]{20,}|sk_live_[A-Za-z0-9]{20,}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----[A-Za-z0-9+/=\\n]{40,}|postgresql://postgres\.[A-Za-z0-9_.-]{100,}@'

          # Only tracked source and config files. Documentation is excluded
          # because it legitimately shows placeholder shapes like
          #   FIREBASE_PRIVATE_KEY="-----BEGIN PRIVATE KEY-----\n...\n"
          # which are not credentials.
          HITS=$(git ls-files \
            | grep -Ev '^(README|AGENTS|DEPLOYMENT|GITHUB_ACTIONS_SETUP|MIGRATION_PLAN|MIGRATION_CHECKLIST|REPOSITORY_CLEANUP|SUPABASE_EMAIL_SETUP)\.md$' \
            | grep -Ev '\.md$|\.example$' \
            | grep -Ev '^\.github/workflows/secret-scanning\.yml$' \
            | xargs grep -IHnE "$PATTERNS" 2>/dev/null || true)

          if [ -n "$HITS" ]; then
            echo ""
            echo "::error::Possible live credential(s) found in tracked files:"
            echo "$HITS" | sed 's/^/    /'
            echo ""
            echo "If this is a real credential: rotate it FIRST, then remove it."
            echo "If it is a false positive, add an exclusion above with a reason."
            exit 1
          fi

          echo "OK - no credential patterns in tracked files."

      - name: Scan full git history
        # History is what makes a leak impossible to undo, so it is scanned
        # separately: a value removed from the tip is still readable at its
        # original commit, which is exactly how the .env leak survived.
        #
        # REPORT-ONLY: this step never fails the build. A repository with a
        # historical leak cannot be "fixed" by deleting files, so failing
        # forever would block all work while fixing nothing. The remedy is
        # ROTATION, which is a human task — so this names the files and prints
        # the rotation steps. `continue-on-error` makes that explicit rather
        # than relying on the step happening not to exit non-zero.
        continue-on-error: true
        run: |
          echo "Scanning git history for credential material..."
          echo "(report-only: a historical leak cannot be removed by deleting files)"
          echo ""

          # `git log -S` searches the PATCHES (what changed) rather than checking
          # out every tree. The earlier version looped `git grep` over 200
          # revisions, which is orders of magnitude slower — on a repository with
          # large generated files it did not finish inside the step timeout at
          # all. Measured here: the tree loop times out, `git log -S` runs in
          # ~0.3s.
          #
          # IMPORTANT: `git log -S` takes a LITERAL SUBSTRING, not a regular
          # expression. Passing `ghp_[A-Za-z0-9]\{36\}` matched nothing, so the
          # scan reported a clean history while a leaked key sat in it. Each
          # entry below is therefore a plain prefix that appears in the real
          # credential, which also makes it format-independent — the same token
          # is caught whether it appears as `KEY=eyJ...`, `"KEY": "eyJ..."` or
          # bare in source.
          FOUND=""
          for NAME in github_pat github_oauth github_server supabase_token vercel_token render_token stripe_live private_key supabase_jwt; do
            case "$NAME" in
              github_pat)     PAT='ghp_' ;;
              github_oauth)   PAT='gho_' ;;
              github_server)  PAT='ghs_' ;;
              supabase_token) PAT='sbp_' ;;
              vercel_token)   PAT='vcp_' ;;
              render_token)   PAT='rnd_' ;;
              stripe_live)    PAT='sk_live_' ;;
              private_key)    PAT='PRIVATE KEY-----' ;;
              # Supabase issues HS256 JWTs; the payload always carries a "role"
              # claim of service_role or anon. Catches both, in any file format.
              supabase_jwt)   PAT='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9' ;;
            esac
            HITS=$(git log --all --format='  %h %ad  %s' --date=short -S "$PAT" 2>/dev/null | head -20 || true)
            if [ -n "$HITS" ]; then
              echo "── $NAME found in history:"
              echo "$HITS"
              FOUND="yes"
            fi
          done

          if [ -n "$FOUND" ]; then
            echo ""
            echo "=========================== ATTENTION ==========================="
            echo "Credential material appears in git HISTORY (see the commits above)."
            echo ""
            echo "Deleting a file does not un-disclose it. The only real remedy is"
            echo "to ROTATE the credential at its source:"
            echo "  * Supabase  -> Settings -> API -> regenerate the service_role key"
            echo "  * GitHub    -> Settings -> Developer settings -> regenerate the PAT"
            echo "  * Vercel    -> Account Settings -> Tokens -> delete and recreate"
            echo "  * Render    -> Account Settings -> API Keys -> delete and recreate"
            echo "  * Google    -> Cloud Console -> rotate the OAuth client secret"
            echo "  * Play      -> App integrity -> request an upload key reset"
            echo "================================================================"
          else
            echo "OK - no credential material in history."
          fi
