name: Typecheck

# This repository deploys to Vercel through Vercel's own Git integration, which
# builds every push to `main`. That workflow is the deploy path, and the gate
# that matters is in `vercel.json` (`npm run typecheck && npm run build`).
#
# The previous version of this file also tried to deploy with `vercel --prod`
# from Actions. It failed on every run from at least 2026-10-28 because the
# VERCEL_TOKEN secret was invalid, while the site kept deploying through the Git
# integration — so it never deployed anything and only produced a red check.
# It is removed rather than repaired: two deploy paths race, and the one inside
# Vercel cannot be skipped.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # Early signal on the pull request. Vercel repeats this check during its own
  # build, which is what actually prevents a broken deploy.
  typecheck:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck
